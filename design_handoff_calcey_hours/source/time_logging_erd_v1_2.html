
<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    primaryColor: dark ? '#1F3A5F' : '#E6F1FB',
    primaryTextColor: dark ? '#B5D4F4' : '#0C447C',
    primaryBorderColor: dark ? '#378ADD' : '#185FA5',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    attributeBackgroundColorEven: dark ? '#1a1a18' : '#F7F9FC',
    attributeBackgroundColorOdd: dark ? '#222220' : '#FFFFFF',
  },
});

const diagram = `erDiagram
  users {
    uuid id PK
    text email
    text full_name
    enum role
    uuid manager_id FK
    boolean is_active
    timestamptz created_at
  }
  projects {
    uuid id PK
    text name
    text description
    uuid created_by FK
    timestamptz created_at
  }
  tasks {
    uuid id PK
    uuid project_id FK
    text name
    timestamptz created_at
  }
  user_projects {
    uuid user_id FK
    uuid project_id FK
    uuid assigned_by FK
    timestamptz assigned_at
  }
  time_entries {
    uuid id PK
    uuid user_id FK
    uuid project_id FK
    uuid task_id FK
    date entry_date
    decimal hours
    text notes
    enum status
    text manager_note
    timestamptz created_at
    timestamptz updated_at
  }
  timer_sessions {
    uuid id PK
    uuid user_id FK
    uuid project_id FK
    uuid task_id FK
    uuid time_entry_id FK
    timestamptz started_at
    timestamptz stopped_at
  }

  users ||--o{ time_entries : "logs"
  users ||--o{ timer_sessions : "runs"
  users ||--o{ user_projects : "assigned via"
  users }o--o{ users : "managed by"
  projects ||--o{ tasks : "contains"
  projects ||--o{ user_projects : "assigned via"
  projects ||--o{ time_entries : "tracked in"
  projects ||--o{ timer_sessions : "tracked in"
  tasks ||--o{ time_entries : "referenced by"
  tasks ||--o{ timer_sessions : "referenced by"
  time_entries ||--o{ timer_sessions : "produced by"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
